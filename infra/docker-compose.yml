# Production stack on one host. Copy infra/.env.example to infra/.env first.
#   docker compose --env-file infra/.env -f infra/docker-compose.yml up -d --build
name: gge

x-node: &node
  build: { context: .., dockerfile: infra/Dockerfile, target: node }
  image: gge-node:${GGE_VERSION:-latest}
  restart: unless-stopped
  environment: &node-env
    # pg reads PGPASSWORD; inside the URL, a "/", "#" or "?" in it breaks parsing.
    DATABASE_URL: postgres://gge@postgres:5432/gge
    PGPASSWORD: ${POSTGRES_PASSWORD}
    GGE_VERSION: ${GGE_VERSION:-latest}
    SENTRY_DSN: ${SENTRY_DSN:-}
  depends_on:
    migrate: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: gge
      POSTGRES_DB: gge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gge -d gge"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: .., dockerfile: infra/Dockerfile, target: node }
    image: gge-node:${GGE_VERSION:-latest}
    command: ["node", "apps/api/src/cli/migrate.ts"]
    environment:
      # pg reads PGPASSWORD; inside the URL, a "/", "#" or "?" in it breaks parsing.
      DATABASE_URL: postgres://gge@postgres:5432/gge
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Set: migrate creates or updates the read-only grafana_ro role with this password.
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *node
    command: ["node", "--import", "./apps/api/src/instrument.ts", "apps/api/src/main.ts"]
    environment:
      <<: *node-env
      SEAL_PUBLIC_KEY: ${SEAL_PUBLIC_KEY:?set SEAL_PUBLIC_KEY in infra/.env}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY in infra/.env}
      CLIENT_ORIGINS: https://app.${DOMAIN}
      ADMIN_ORIGINS: https://admin.${DOMAIN}
      DOCS_ORIGINS: https://docs.${DOMAIN}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET:?set CENTRIFUGO_TOKEN_SECRET in infra/.env}
      # Unset: the bundled geoip service. Set it empty to turn IP detection off; the browser's language is used instead.
      GEOIP_URL: ${GEOIP_URL-http://geoip:8080}
      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Pushes live updates to browsers over /connection/websocket. It reads the
  # centrifugo_outbox table the runner writes, so it needs no other service.
  centrifugo:
    build: { context: .., dockerfile: infra/Dockerfile, target: centrifugo }
    image: gge-centrifugo:${GGE_VERSION:-latest}
    restart: unless-stopped
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: https://app.${DOMAIN} https://admin.${DOMAIN}
      # The password comes from PGPASSWORD, as it does for the API and runner.
      CENTRIFUGO_CONSUMERS_OUTBOX_POSTGRESQL_DSN: postgres://gge@postgres:5432/gge
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Country lookup for the "Automatic" language, from MaxMind's GeoLite2 database (docs/deployment/dokploy.md#ip-language-detection).
  # Internal only: no domain, not on dokploy-network. No healthcheck: the image is a slim Rust binary with no shell or wget to run one, and the API treats a missing answer as "unknown".
  geoip:
    image: alisinabh/atlas:v0.0.6
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      MAXMIND_DB_VARIANT: GeoLite2-Country
      DB_UPDATE_INTERVAL_SECONDS: "86400"
    volumes: [geoip-db:/opt/atlas/db]

  runner:
    <<: *node
    command: ["node", "--import", "./apps/runner/src/instrument.ts", "apps/runner/src/main.ts"]
    # The runner holds an advisory lock; a second copy exits. Keep one replica.
    stop_grace_period: 60s
    environment:
      <<: *node-env
      SEAL_PRIVATE_KEY: ${SEAL_PRIVATE_KEY:?set SEAL_PRIVATE_KEY in infra/.env}
      MAX_ACCOUNTS: ${MAX_ACCOUNTS:-50}
      START_GAP_MS: ${START_GAP_MS:-2000}
      GAME_CLIENT_VERSION: ${GAME_CLIENT_VERSION:-}
      GAME_CLIENT_BUILD: ${GAME_CLIENT_BUILD:-}
      INBOUND_STALE_MS: ${INBOUND_STALE_MS:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
      PROXY_REQUIRED: ${PROXY_REQUIRED:-}
      BOT_HUMANIZE: ${BOT_HUMANIZE:-}
      BOT_HUMANIZE_ACCOUNTS: ${BOT_HUMANIZE_ACCOUNTS:-}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      METRICS_PORT: "9464"
    volumes: [gamedata:/data]

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
      args:
        VITE_CLIENT_URL: https://app.${DOMAIN}
        VITE_GRAFANA_URL: https://grafana.${DOMAIN}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        PUBLIC_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_GGE_VERSION: ${GGE_VERSION:-latest}
        DOCS_NOINDEX: ${DOCS_NOINDEX:-}
      secrets: [sentry_auth_token]
    image: gge-web:${GGE_VERSION:-latest}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in infra/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in infra/.env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy-data:/data, caddy-config:/config]
    depends_on:
      api: { condition: service_healthy }

  prometheus:
    build: { context: .., dockerfile: infra/Dockerfile, target: prometheus }
    image: gge-prometheus:${GGE_VERSION:-latest}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes: [prometheus:/prometheus]

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    restart: unless-stopped
    # Reads the host's metrics, not the container's: host PID namespace and the host root mounted read-only.
    command: [--path.rootfs=/host]
    pid: host
    volumes: ["/:/host:ro,rslave"]

  grafana:
    build: { context: .., dockerfile: infra/Dockerfile, target: grafana }
    image: gge-grafana:${GGE_VERSION:-latest}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in infra/.env}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # With GRAFANA_DB_PASSWORD set, Grafana reads Postgres as grafana_ro and never sees POSTGRES_PASSWORD.
      # Unset, GGE_DB_USER is empty and entrypoint.sh falls back to gge.
      GGE_DB_USER: ${GRAFANA_DB_PASSWORD:+grafana_ro}
      GGE_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      GRAFANA_ALERT_DISCORD_WEBHOOK: ${GRAFANA_ALERT_DISCORD_WEBHOOK:-}
    volumes: [grafana:/var/lib/grafana]
    depends_on: [prometheus]

  backup:
    build: { context: .., dockerfile: infra/Dockerfile, target: backup }
    image: gge-backup:${GGE_VERSION:-latest}
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # Off-site copies to Google Drive (docs/deployment/backup-restore.md).
      # Empty GDRIVE_TOKEN keeps dumps on this host only.
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${GDRIVE_CLIENT_ID:-}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${GDRIVE_CLIENT_SECRET:-}
      RCLONE_CONFIG_GDRIVE_TOKEN: ${GDRIVE_TOKEN:-}
      RCLONE_CONFIG_OFFSITE_TYPE: crypt
      RCLONE_CONFIG_OFFSITE_REMOTE: gdrive:gge-backups
      RCLONE_CONFIG_OFFSITE_FILENAME_ENCRYPTION: "off"
      RCLONE_CONFIG_OFFSITE_DIRECTORY_NAME_ENCRYPTION: "false"
    entrypoint: ["/bin/bash", "/backup/backup-loop.sh"]
    volumes: [backups:/backups]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres:
  gamedata:
  caddy-data:
  caddy-config:
  prometheus:
  grafana:
  backups:
  geoip-db:

secrets:
  # Uploads frontend source maps at build time; unset skips the upload.
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN
