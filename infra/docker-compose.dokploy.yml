# The same stack for Dokploy (docs/deployment/dokploy.md). Dokploy's Traefik
# owns ports 80/443 and TLS, so nothing here publishes a port. Assign domains in
# Dokploy: app.<domain> and admin.<domain> to service "web" port 80,
# grafana.<domain> to service "grafana" port 3000. Dokploy writes the
# Environment tab to infra/.env, which the ${...} below read.

x-node: &node
  build: { context: .., dockerfile: infra/Dockerfile, target: node }
  image: gge-node:${GGE_VERSION:-latest}
  restart: unless-stopped
  environment: &node-env
    # pg reads PGPASSWORD; inside the URL, a "/", "#" or "?" in it breaks parsing.
    DATABASE_URL: postgres://gge@postgres:5432/gge
    PGPASSWORD: ${POSTGRES_PASSWORD}
    GGE_VERSION: ${GGE_VERSION:-latest}
  depends_on:
    migrate: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: gge
      POSTGRES_DB: gge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy's Environment tab}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gge -d gge"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: .., dockerfile: infra/Dockerfile, target: node }
    image: gge-node:${GGE_VERSION:-latest}
    command: ["node", "apps/api/src/cli/migrate.ts"]
    environment:
      # pg reads PGPASSWORD; inside the URL, a "/", "#" or "?" in it breaks parsing.
      DATABASE_URL: postgres://gge@postgres:5432/gge
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *node
    command: ["node", "apps/api/src/main.ts"]
    environment:
      <<: *node-env
      SEAL_PUBLIC_KEY: ${SEAL_PUBLIC_KEY:?set SEAL_PUBLIC_KEY in Dokploy's Environment tab}
      CLIENT_ORIGINS: https://app.${DOMAIN}
      ADMIN_ORIGINS: https://admin.${DOMAIN}
      CLIENT_URL: https://app.${DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  runner:
    <<: *node
    command: ["node", "apps/runner/src/main.ts"]
    # The runner holds an advisory lock; a second copy exits. Keep one replica.
    stop_grace_period: 60s
    environment:
      <<: *node-env
      SEAL_PRIVATE_KEY: ${SEAL_PRIVATE_KEY:?set SEAL_PRIVATE_KEY in Dokploy's Environment tab}
      MAX_ACCOUNTS: ${MAX_ACCOUNTS:-50}
      START_GAP_MS: ${START_GAP_MS:-2000}
      GAME_CLIENT_VERSION: ${GAME_CLIENT_VERSION:-}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      METRICS_PORT: "9464"
    volumes: [gamedata:/data]

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
      args:
        CADDYFILE: infra/Caddyfile.dokploy
        VITE_CLIENT_URL: https://app.${DOMAIN}
        VITE_GRAFANA_URL: https://grafana.${DOMAIN}
    image: gge-web:${GGE_VERSION:-latest}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in Dokploy's Environment tab}
    expose: ["80"]
    # Explicit default network: Dokploy adds dokploy-network to services with a
    # domain, and a service listing networks would otherwise lose the default one.
    networks: [default, dokploy-network]
    depends_on:
      api: { condition: service_healthy }

  prometheus:
    build: { context: .., dockerfile: infra/Dockerfile, target: prometheus }
    image: gge-prometheus:${GGE_VERSION:-latest}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes: [prometheus:/prometheus]

  grafana:
    build: { context: .., dockerfile: infra/Dockerfile, target: grafana }
    image: gge-grafana:${GGE_VERSION:-latest}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in Dokploy's Environment tab}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GGE_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [grafana:/var/lib/grafana]
    expose: ["3000"]
    networks: [default, dokploy-network]
    depends_on: [prometheus]

  backup:
    build: { context: .., dockerfile: infra/Dockerfile, target: backup }
    image: gge-backup:${GGE_VERSION:-latest}
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/bash", "/backup/backup-loop.sh"]
    volumes: [backups:/backups]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres:
  gamedata:
  prometheus:
  grafana:
  backups:

networks:
  dokploy-network:
    external: true
