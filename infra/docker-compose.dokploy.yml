# The same stack for Dokploy (docs/deployment/dokploy.md). Dokploy's Traefik
# owns ports 80/443 and TLS, so nothing here publishes a port. Assign domains in
# Dokploy: app.<domain> and admin.<domain> to service "web" port 80,
# grafana.<domain> to service "grafana" port 3000. Dokploy writes the
# Environment tab to infra/.env, which the ${...} below read.

x-node: &node
  build: { context: .., dockerfile: infra/Dockerfile, target: node }
  image: gge-node:${GGE_VERSION:-latest}
  restart: unless-stopped
  environment: &node-env
    # pg reads PGPASSWORD; inside the URL, a "/", "#" or "?" in it breaks parsing.
    DATABASE_URL: postgres://gge@postgres:5432/gge
    PGPASSWORD: ${POSTGRES_PASSWORD}
    GGE_VERSION: ${GGE_VERSION:-latest}
    SENTRY_DSN: ${SENTRY_DSN:-}
  depends_on:
    migrate: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: gge
      POSTGRES_DB: gge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy's Environment tab}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gge -d gge"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: .., dockerfile: infra/Dockerfile, target: node }
    image: gge-node:${GGE_VERSION:-latest}
    command: ["node", "apps/api/src/cli/migrate.ts"]
    environment:
      # pg reads PGPASSWORD; inside the URL, a "/", "#" or "?" in it breaks parsing.
      DATABASE_URL: postgres://gge@postgres:5432/gge
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *node
    command: ["node", "--import", "./apps/api/src/instrument.ts", "apps/api/src/main.ts"]
    environment:
      <<: *node-env
      SEAL_PUBLIC_KEY: ${SEAL_PUBLIC_KEY:?set SEAL_PUBLIC_KEY in Dokploy's Environment tab}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY in Dokploy's Environment tab}
      CLIENT_ORIGINS: https://app.${DOMAIN}
      ADMIN_ORIGINS: https://admin.${DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET:?set CENTRIFUGO_TOKEN_SECRET in Dokploy's Environment tab}
      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Pushes live updates to browsers over /connection/websocket. It reads the
  # centrifugo_outbox table the runner writes, so it needs no other service.
  centrifugo:
    build: { context: .., dockerfile: infra/Dockerfile, target: centrifugo }
    image: gge-centrifugo:${GGE_VERSION:-latest}
    restart: unless-stopped
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: https://app.${DOMAIN} https://admin.${DOMAIN}
      # The password comes from PGPASSWORD, as it does for the API and runner.
      CENTRIFUGO_CONSUMERS_OUTBOX_POSTGRESQL_DSN: postgres://gge@postgres:5432/gge
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  runner:
    <<: *node
    command: ["node", "--import", "./apps/runner/src/instrument.ts", "apps/runner/src/main.ts"]
    # The runner holds an advisory lock; a second copy exits. Keep one replica.
    stop_grace_period: 60s
    environment:
      <<: *node-env
      SEAL_PRIVATE_KEY: ${SEAL_PRIVATE_KEY:?set SEAL_PRIVATE_KEY in Dokploy's Environment tab}
      MAX_ACCOUNTS: ${MAX_ACCOUNTS:-50}
      START_GAP_MS: ${START_GAP_MS:-2000}
      GAME_CLIENT_VERSION: ${GAME_CLIENT_VERSION:-}
      GAME_CLIENT_BUILD: ${GAME_CLIENT_BUILD:-}
      INBOUND_STALE_MS: ${INBOUND_STALE_MS:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
      PROXY_REQUIRED: ${PROXY_REQUIRED:-}
      BOT_HUMANIZE: ${BOT_HUMANIZE:-}
      BOT_HUMANIZE_ACCOUNTS: ${BOT_HUMANIZE_ACCOUNTS:-}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      METRICS_PORT: "9464"
    volumes: [gamedata:/data]

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
      args:
        CADDYFILE: infra/Caddyfile.dokploy
        VITE_CLIENT_URL: https://app.${DOMAIN}
        VITE_GRAFANA_URL: https://grafana.${DOMAIN}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_GGE_VERSION: ${GGE_VERSION:-latest}
      secrets: [sentry_auth_token]
    image: gge-web:${GGE_VERSION:-latest}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in Dokploy's Environment tab}
    expose: ["80"]
    # Explicit default network: Dokploy adds dokploy-network to services with a
    # domain, and a service listing networks would otherwise lose the default one.
    networks: [default, dokploy-network]
    depends_on:
      api: { condition: service_healthy }

  prometheus:
    build: { context: .., dockerfile: infra/Dockerfile, target: prometheus }
    image: gge-prometheus:${GGE_VERSION:-latest}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes: [prometheus:/prometheus]

  grafana:
    build: { context: .., dockerfile: infra/Dockerfile, target: grafana }
    image: gge-grafana:${GGE_VERSION:-latest}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in Dokploy's Environment tab}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GGE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      GRAFANA_ALERT_DISCORD_WEBHOOK: ${GRAFANA_ALERT_DISCORD_WEBHOOK:-}
    volumes: [grafana:/var/lib/grafana]
    expose: ["3000"]
    networks: [default, dokploy-network]
    depends_on: [prometheus]

  backup:
    build: { context: .., dockerfile: infra/Dockerfile, target: backup }
    image: gge-backup:${GGE_VERSION:-latest}
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # Off-site copies to Google Drive (docs/deployment/backup-restore.md).
      # Empty GDRIVE_TOKEN keeps dumps on this host only.
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${GDRIVE_CLIENT_ID:-}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${GDRIVE_CLIENT_SECRET:-}
      RCLONE_CONFIG_GDRIVE_TOKEN: ${GDRIVE_TOKEN:-}
      RCLONE_CONFIG_OFFSITE_TYPE: crypt
      RCLONE_CONFIG_OFFSITE_REMOTE: gdrive:gge-backups
      RCLONE_CONFIG_OFFSITE_FILENAME_ENCRYPTION: "off"
      RCLONE_CONFIG_OFFSITE_DIRECTORY_NAME_ENCRYPTION: "false"
    entrypoint: ["/bin/bash", "/backup/backup-loop.sh"]
    volumes: [backups:/backups]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres:
  gamedata:
  prometheus:
  grafana:
  backups:

networks:
  dokploy-network:
    external: true

secrets:
  # Uploads frontend source maps at build time; unset skips the upload.
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN
