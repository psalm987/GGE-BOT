<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F1E4" />
    <title>GGE Command</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        var l = localStorage.getItem("gge.locale")
        if (/^(bg|cs|da|de|el|en|es|et|fi|fr|ga|hr|hu|it|lt|lv|mt|nl|pl|pt|ro|sk|sl|sv|nb|tr|uk|ar)$/.test(l)) {
          document.documentElement.lang = l
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr"
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
