terms:
  - id: plugin
    term: الإضافة
    aliases: [الإضافات]
    category: bot
    short: مهمة واحدة يقوم بها البوت، مثل جمع الضرائب أو إرسال الهجمات. تشغّل كل إضافة أو توقفها بمفردها.
    long: >-
      الإضافة مهمة يعرف البوت كيف ينفذها. لكل إضافة مفتاحها وإعداداتها الخاصة. يمكنك تشغيل عدة إضافات معًا، وتُحسب إضافات الهجوم ضمن حد الهجمات لديك.
      تخيّلها مثل تطبيقات الهاتف. لا يفعل الهاتف شيئًا خاصًا حتى تفتح تطبيقًا، وكل تطبيق يؤدي مهمة واحدة.
    seeAlso: [attack-cap]
  - id: log
    term: السجل
    aliases: [السجلات]
    category: bot
    short: قائمة متواصلة بما فعله البوت ومتى. هي أول مكان تنظر إليه عندما يبدو أن شيئًا ما غير طبيعي.
    long: >-
      تحصل كل حركة يقوم بها البوت على سطر في السجل مع الوقت وحساب اللعبة المرتبط بها. افتح صفحة السجلات لقراءتها مباشرة أو لتصفيتها حسب الحساب أو لتنزيلها كنص.
      تخيّله مثل سجل السفينة. إذا أردت أن تعرف ما حدث أثناء غيابك، فاقرأه.
    seeAlso: [run]
  - id: game-account
    term: حساب اللعبة
    category: account
    short: لاعبك في Goodgame Empire. تضيفه إلى GGE Command ليدخل البوت ويلعب بدلًا منك.
    long: >-
      حساب اللعبة هو الحساب الذي تلعب به داخل اللعبة. وهو منفصل عن حسابك في GGE Command الذي يحمل بريدك وخطتك. تضيفه بذكر اسمه وخادمه وكلمة مرور اللعبة.
      تخيّله مثل مفتاح وقفل. حسابك في GGE Command يحمل المفتاح، وحساب اللعبة هو القفل.
    seeAlso: [server]
  - id: server
    term: الخادم
    aliases: [العالم]
    category: game
    short: عالم اللعبة الذي يوجد عليه حسابك. اختر الخادم نفسه الذي تلعب عليه، وإلا لن يتمكن البوت من الدخول.
    long: >-
      تشغّل Goodgame Empire عوالم منفصلة كثيرة تسمى خوادم. حسابك موجود على واحد منها فقط. عند إضافة الحساب يجب أن يطابق الخادم الذي تختاره الخادم الذي تلعب عليه.
      تخيّله مثل مدينة تحمل الاسم نفسه في بلدان كثيرة. عليك أن تحدد أي بلد تقصد.
    seeAlso: [game-account]
  - id: attack-cap
    term: حد الهجمات
    category: bot
    short: أكبر عدد من إضافات الهجوم يمكن لحساب واحد تشغيله في الوقت نفسه. وقد يختلف من حساب إلى آخر.
    long: >-
      إضافات الهجوم ترسل الجيوش، لذلك يحدد GGE Command عدد ما يعمل منها معًا. الحد هو 4 أو 6 أو بلا حد، ويُضبط لكل حساب. إذا شغّلت أكثر مما يسمح به حدك، فلن تُحفظ الإعدادات.
      تخيّله مثل مقاعد حول طاولة. الجميع مرحّب به، لكن لا يجلس إلا عدد محدود في الوقت نفسه.
    seeAlso: [plugin]
  - id: two-factor
    term: تسجيل الدخول بخطوتين
    aliases: [المصادقة الثنائية, رمز المصادقة]
    category: tech
    short: خطوة دخول تطلب رمزًا من ستة أرقام من تطبيق مصادقة، إضافة إلى كلمة المرور.
    long: >-
      تسجيل الدخول بخطوتين يضيف فحصًا ثانيًا بعد كلمة المرور. ينشئ تطبيق المصادقة رمزًا جديدًا من ستة أرقام كل 30 ثانية. حسابات اللاعبين في GGE Command لا تستخدمه، ويستخدمه فريق العمل فقط.
      تخيّله مثل باب بقفلين. يحتاج اللص إلى المفتاحين معًا.
    seeAlso: []
