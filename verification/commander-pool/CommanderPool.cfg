\* The code as it is: two commanders, three attack loops, one of them shaped
\* like attackKhan. check.sh builds its other configs from the same constants.
CONSTANTS
    Lords = {l1, l2}
    Plugins = {p1, p2, p3}
    LoopPlugins = {p1}
    NoLord = NoLord
    Mutation = "none"

INIT Init
NEXT Next

INVARIANT TypeOK
INVARIANT NoDoubleBooking
INVARIANT NoBusyLordSent
INVARIANT NoStrandedWaiter
INVARIANT NoLeakedLord
